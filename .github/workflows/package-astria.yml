name: package-astria

# Le conteneur de développement n'a pas accès aux CDN Higgsfields (politique réseau) :
# ce workflow sert de relais — il télécharge les assets générés, les optimise, les
# committe sur la branche, construit le zip du jeu et l'envoie vers l'URL d'upload signée.

on:
  workflow_dispatch:
    inputs:
      upload_url:
        description: "URL PUT présignée Higgsfields pour le zip du jeu (optionnel)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer et optimiser les assets générés
        run: |
          pip3 install --quiet pillow
          cd game && python3 tools/fetch_assets.py

      - name: Committer les assets sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets game/tools/contact_sheet.jpg
          git diff --cached --quiet || git commit -m "Assets générés du jeu ASTRIA (portraits, keyart, icône)"
          git push

      - name: Construire le zip du jeu
        run: |
          cd game && zip -r ../astria-game.zip . -x "tools/*"
          unzip -l ../astria-game.zip

      - name: Envoyer le zip vers Higgsfields
        if: ${{ github.event.inputs.upload_url != '' }}
        env:
          UPLOAD_URL: ${{ github.event.inputs.upload_url }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT \
            -H "Content-Type: application/octet-stream" \
            --data-binary @astria-game.zip "$UPLOAD_URL")
          echo "PUT status: $code"
          test "$code" = "200"

      - uses: actions/upload-artifact@v4
        with:
          name: astria-game
          path: astria-game.zip
