name: package-astria

# Le conteneur de développement n'a pas accès aux CDN Higgsfields (politique réseau) :
# ce workflow sert de relais — il télécharge les assets générés, les optimise, les
# committe sur la branche avec le zip du jeu prêt à être importé pour déploiement.

on:
  push:
    branches: [claude/idle-rpg-game-design-l4w7ot]
    paths:
      - "game/**"
      - ".github/workflows/package-astria.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer et optimiser les assets générés
        run: |
          pip3 install --quiet pillow
          cd game && python3 tools/fetch_assets.py

      - name: Optimiser les modèles 3D pour le mobile
        run: |
          if ls game/assets/models/*.glb >/dev/null 2>&1; then
            for f in game/assets/models/*.glb; do
              npx --yes @gltf-transform/cli optimize "$f" "$f" \
                --compress false --texture-compress false --texture-size 512 --simplify false || true
              ls -la "$f"
            done
          fi

      - name: Construire le zip du jeu (logic.js + index.html à la racine)
        run: |
          cd game && zip -r ../astria-game.zip . -x "tools/*"
          unzip -l ../astria-game.zip
          sha256sum ../astria-game.zip

      - name: Committer assets + zip sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets game/tools astria-game.zip
          git diff --cached --quiet || git commit -m "Assets générés + zip du jeu ASTRIA [skip ci]"
          git push
