<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ASTRIA — Les Éclats du Ciel Brisé</title>
<meta name="theme-color" content="#0b0a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icon.png">
<link rel="icon" href="./assets/icon.png">
<style>
:root{
  --bg:#0b0a1f; --panel:#171432cc; --panel2:#1e1a3f; --line:#332d5e;
  --gold:#f2c14e; --gold2:#c98f1e; --ink:#f3efff; --dim:#a49ecb;
  --teal:#4fb8d6; --violet:#a06fd8; --green:#59d977; --red:#e05c5c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
/* ciel procédural du hub — formule de style : ciel doré, îles, brume violette */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% -10%, #f7c46b33 0%, transparent 60%),
    radial-gradient(90% 50% at 80% 110%, #6b3fa055 0%, transparent 60%),
    radial-gradient(2px 2px at 20% 30%, #ffffffaa 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 70% 18%, #ffffff88 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 40% 60%, #ffffff55 50%, transparent 51%),
    radial-gradient(2px 2px at 85% 45%, #ffffff77 50%, transparent 51%),
    linear-gradient(180deg,#151038 0%, #1c1440 45%, #241a4e 75%, #33245c 100%);}
#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.curbar{display:flex;gap:8px;justify-content:flex-end;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 6px}
.cur{background:#00000055;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600}
.screen{flex:1;overflow-y:auto;padding:4px 14px 14px;-webkit-overflow-scrolling:touch}
h1{margin:0;font-size:34px;letter-spacing:6px;text-shadow:0 2px 14px #f2c14e66}
h2{font-size:20px;margin:8px 0 10px}
h3{margin:4px 0 10px}
.hero-head{position:relative;border-radius:16px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
.keyart{width:100%;height:150px;object-fit:cover;display:block}
.title-block{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
  background:linear-gradient(180deg,#0b0a1f22,#0b0a1fcc);text-align:center}
.title-block p{margin:2px 0 0;color:var(--gold);font-size:12px;letter-spacing:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;backdrop-filter:blur(6px)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.dim{color:var(--dim);font-size:13px}
.hint{color:var(--dim);font-size:12px;line-height:1.5}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:12px;margin-top:8px;font-size:15px;font-weight:700;
  color:#241a05;background:linear-gradient(180deg,#ffe9a8,var(--gold) 45%,var(--gold2));cursor:pointer;
  box-shadow:0 3px 0 #7a5510, 0 6px 16px #00000066}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5510}
.btn.primary{background:linear-gradient(180deg,#9fe3ff,var(--teal) 45%,#2a7f9c);box-shadow:0 3px 0 #17515f,0 6px 16px #00000066;color:#04222c}
.btn.ghost{background:#ffffff10;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:linear-gradient(180deg,#ff9e9e,var(--red) 45%,#a03030);box-shadow:0 3px 0 #6b1d1d;color:#2a0505}
.btn.small{padding:8px;font-size:13px;width:auto;padding-inline:14px}
.btn:disabled{filter:grayscale(.9) brightness(.6);pointer-events:none}
.btn small{display:block;font-size:10px;font-weight:500;opacity:.75}
/* AFK */
.afk-panel{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center}
.afk-chest{font-size:40px;filter:drop-shadow(0 0 12px #f2c14e88);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.afk-info{display:flex;flex-direction:column;gap:2px;font-size:13px}
.afk-actions{grid-column:1/3;display:flex;gap:8px}
.afk-actions .btn{margin-top:0}
/* héros */
.team-row{display:flex;gap:8px;overflow-x:auto;padding:6px 0;min-height:40px}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hcard{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center;cursor:pointer;min-width:92px}
.hcard.locked{filter:grayscale(1) brightness(.45)}
.hport{position:relative;border-radius:10px;overflow:hidden;border:2px solid var(--rar,#555)}
.hport img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.htag{position:absolute;top:3px;right:3px;background:#000a;border-radius:8px;padding:1px 5px;font-size:11px}
.hname{font-size:12px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmeta{font-size:10px;color:var(--rar,#999)}
/* détail héros */
.hd-top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.hd-top img{width:84px;height:84px;border-radius:14px;object-fit:cover;border:2px solid var(--rar,#666)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{border:1px solid var(--line);border-radius:10px;padding:2px 8px;font-size:11px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.stats4 span{background:#00000040;border-radius:10px;padding:6px;text-align:center;font-size:11px;color:var(--dim);display:flex;flex-direction:column}
.stats4 b{color:var(--ink);font-size:14px}
.ult-box{background:#f2c14e14;border:1px solid #f2c14e44;border-radius:12px;padding:10px;font-size:13px}
.ult-box p{margin:4px 0 0;color:var(--dim)}
.hd-actions{margin-top:10px}
/* campagne */
.smap{display:flex;gap:6px;justify-content:space-between;margin:12px 0;flex-wrap:wrap}
.snode{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;
  background:#00000050;border:2px solid var(--line);font-size:14px}
.snode.done{border-color:var(--green);color:var(--green)}
.snode.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px #f2c14e66;animation:bob 1.8s infinite}
.snode.lock{opacity:.4}
.boss-tag{background:var(--red);color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:800}
/* invocation */
.altar{text-align:center}
.altar-star{font-size:56px;color:var(--gold);text-shadow:0 0 30px var(--gold);animation:spin 9s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.pity{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--dim);margin:8px 0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:46vh;overflow-y:auto;margin:8px 0}
.scard{background:var(--panel2);border:2px solid var(--rar);border-radius:12px;padding:5px;text-align:center;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.scard img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.sname{display:block;font-size:11px;font-weight:700;margin-top:3px}
.srar{font-size:10px}
.stag{display:block;font-size:9px;color:var(--dim)}
/* quêtes */
.quest{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.quest>div{flex:1}
.qbar{height:6px;background:#00000060;border-radius:4px;margin:6px 0 3px;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green))}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.lcell{background:#00000040;border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:10px;color:var(--dim);display:flex;flex-direction:column;gap:2px}
.lcell b{color:var(--ink);font-size:11px}
.lcell.got{opacity:.45}.lcell.got::after{content:"✓";color:var(--green)}
.lcell.cur{border-color:var(--gold);box-shadow:0 0 10px #f2c14e44}
/* nav */
.nav{display:flex;background:#0d0b24ee;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{position:relative;flex:1;background:none;border:none;color:var(--dim);font-size:10px;padding:8px 2px 9px;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav-btn .ic{font-size:21px;filter:grayscale(.6);transition:transform .15s}
.nav-btn.on{color:var(--gold)}.nav-btn.on .ic{filter:none;transform:scale(1.15)}
.nav-btn.big .ic{font-size:27px}
.badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--red);color:#fff;border-radius:9px;
  min-width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800}
/* modales */
.modal-wrap{position:fixed;inset:0;z-index:40;background:#05041299;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.modal{position:relative;background:linear-gradient(180deg,#221c48,#161230);border:1px solid var(--gold2);
  border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px #000c}
.modal-x{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer;padding:6px}
/* toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);z-index:60;background:#241f4ae6;
  border:1px solid var(--gold2);color:var(--ink);border-radius:14px;padding:9px 16px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
/* combat */
#battle{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:var(--bg)}
#battle.open{display:flex}
.bbar{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:#0d0b24}
.bbar b{font-size:14px}
.bbar button{background:#ffffff14;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer}
#bCanvas{flex:1;width:100%;display:block}
#bResult{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#050412aa;padding:20px}
#bResult.open{display:flex}
.bres-box{background:linear-gradient(180deg,#221c48,#161230);border:1px solid var(--gold2);border-radius:18px;padding:22px;width:100%;max-width:380px;text-align:center;animation:pop .3s ease}
.bres-box .win{color:var(--gold);font-size:28px;text-shadow:0 0 20px #f2c14e88;margin:0 0 8px}
.bres-box .lose{color:var(--dim);font-size:24px;margin:0 0 8px}
.chapter-clear{color:var(--teal);font-weight:700}
#dev{position:fixed;top:4px;left:4px;color:#0f0;font:12px monospace;display:none;z-index:99}
</style>
</head>
<body>
<div id="app"></div>
<div id="battle">
  <div class="bbar"><b id="bTitle"></b><div style="display:flex;gap:8px">
    <button id="bSpeed">×1</button><button id="bQuit">✕</button></div></div>
  <canvas id="bCanvas"></canvas>
  <div id="bResult"></div>
</div>
<div id="dev"></div>
<script type="module" src="./game.js"></script>
</body>
</html>
